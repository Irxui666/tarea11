<header class="header">
  <button
    type="button"
    class="btn-menu"
    aria-label="Mostrar u ocultar menú"
    (click)="toggleMenu.emit()"
  >
    ☰
  </button>

  <a routerLink="/inicio" class="marca">PharmaSoft</a>

  <nav class="menubar">
    <a routerLink="/inicio">Inicio</a>
    <a href="http://localhost:8080/swagger-ui.html" target="_blank" rel="noopener">API</a>
  </nav>

  @if (auth.sesion(); as s) {
    <div class="usuario"><a routerLink="/mi-cuenta">{{ s.nombreCompleto }}</a>
      <small>{{ s.roles.join(' · ') }} · expira {{ s.expiraEn | date: 'HH:mm' }}</small></div>
    <button class="btn-salir" (click)="auth.cerrarSesion()">Cerrar sesión</button>
  }
</header>
@if (auth.porVencer()) {
  <div class="aviso-sesion" role="alert">Su sesión vencerá en menos de un minuto. Guarde su trabajo; deberá iniciar sesión nuevamente.</div>
}
